[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "strategy-studio"
version = "0.1.0"
description = "Deterministic strategy question router"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
[project.optional-dependencies]
test = ["pytest>=7.4"]
[project.scripts]
strategy-route = "strategy_studio.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
