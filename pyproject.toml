[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "strategy-studio"
version = "0.3.0"
description = "Deterministic strategy question router"
readme = "README.md"
authors = [
  { name = "Mike Rodgers" }
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
license = { text = "MIT" }
dependencies = []
[project.optional-dependencies]
test = ["pytest>=7.4", "ruff>=0.6"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/mrodgersjs-web/strategy-studio"
Repository = "https://github.com/mrodgersjs-web/strategy-studio"
Issues = "https://github.com/mrodgersjs-web/strategy-studio/issues"
[project.scripts]
strategy-route = "strategy_studio.cli:main"
strategy-studio = "strategy_studio.cli:studio"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
strategy_studio = ["data/*.json", "data/*.jsonl"]
[tool.ruff]
line-length = 140
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
