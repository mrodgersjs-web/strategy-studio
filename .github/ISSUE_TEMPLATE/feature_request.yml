name: Feature request
description: Suggest a method, a keyword set, or a worksheet improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What the router cannot do today that it should.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you want to happen instead.
    validations:
      required: true
