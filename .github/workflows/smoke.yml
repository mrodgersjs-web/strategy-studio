name: smoke
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Lint
        run: ruff check .
      - name: Tests with coverage
        run: pytest -q --cov=strategy_studio --cov-report=term-missing
      - name: Smoke (route sample questions, verify audit log, accuracy gates)
        run: bash scripts/smoke.sh
